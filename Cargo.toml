[package]
name = "oath-web"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dropshot = "0.17.1"
getrandom = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
ipnet = "2.12.2"
pbkdf2 = "0.13.0"
pcsc = "2.9.0"
schemars = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
slog = "2.8.2"
slog-async = "2.8.0"
slog-json = "2.6.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
zeroize = "1.9.0"

[dev-dependencies]
expectorate = "1.3.0"
hex-literal = "1.1.0"
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1.53.2", features = ["test-util", "macros", "rt"] }
