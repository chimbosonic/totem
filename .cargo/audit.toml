# cargo-audit configuration. The same exceptions, with the same reasons, are
# in deny.toml; keep the two lists in step.
[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa: dev-only, public-key verification in tests; no fix released
    "RUSTSEC-2024-0436", # paste: compile-time only (dropshot proc-macro)
    "RUSTSEC-2025-0134", # rustls-pemfile: only reached when dropshot is given TLS config, which totem never does
]
