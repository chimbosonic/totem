# oath-web behind the existing Traefik v3 (PLAN.md section 13).
#
# Placeholders to set for the real setup: the Host rule, the network name,
# the LAN ranges in oath-lan, OATH_TRUSTED_PROXIES (the Traefik network's
# CIDR), and any label constraint your Traefik uses (for example an `edge`
# label). Do not publish a host port: only Traefik may reach the service.
#
# Needs pcscd running on the host. The socket is mounted read-write.

services:
  oath-web:
    image: oath-web:latest
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /run/pcscd:/run/pcscd
    environment:
      OATH_TRUSTED_PROXIES: "172.16.0.0/12"
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.http.routers.oath.rule: Host(`oath.internal.example`)
      traefik.http.routers.oath.entrypoints: websecure
      traefik.http.routers.oath.tls: "true"
      traefik.http.routers.oath.middlewares: oath-lan,oath-headers
      traefik.http.middlewares.oath-lan.ipallowlist.sourcerange: "192.168.0.0/16,10.0.0.0/8"
      # Backstop for responses Dropshot builds before a handler runs (unknown
      # routes, request body errors), which the app cannot add headers to.
      # Keep the CSP identical to src/api/security.rs (a test checks this).
      traefik.http.middlewares.oath-headers.headers.contentSecurityPolicy: "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
      traefik.http.middlewares.oath-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.oath-headers.headers.frameDeny: "true"
      traefik.http.middlewares.oath-headers.headers.referrerPolicy: "no-referrer"
      traefik.http.middlewares.oath-headers.headers.customResponseHeaders.Cache-Control: "no-store"
      traefik.http.services.oath.loadbalancer.server.port: "8080"

networks:
  traefik:
    external: true
